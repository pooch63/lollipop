# OpenEvolve config for the search program. The runner swaps in the model
# or the mock client. The evaluation file is heuristics/oe.py, passed on the
# command line, not in this file.
# Full rewrite: the evolver replaces search(), it does not patch a reducer.
max_iterations: 3
checkpoint_interval: 1
# diff_based_evolution false already rewrites the whole program each iteration.
diff_based_evolution: false
full_rewrite_probability: 0.0
max_code_length: 30000
random_seed: 0
language: python
log_level: INFO
early_stopping_patience: null
llm:
  temperature: 0.7
  max_tokens: 4000
  models:
    - name: mock
      weight: 1.0
      temperature: 0.7
      max_tokens: 4000
  evaluator_models: []
prompt:
  system_message: "You evolve search(G, p, q, theta). The runner replaces this text."
database:
  num_islands: 1
  population_size: 20
  archive_size: 20
  feature_dimensions:
    - rho
    - alpha_hat
  feature_bins:
    rho: 5
    alpha_hat: 6
  island_initial_programs: []
  migration_interval: 1000
  random_seed: 0
evaluator:
  timeout: 1800
  max_retries: 0
  cascade_evaluation: true
  cascade_thresholds:
    - 0.05
  parallel_evaluations: 1
  use_llm_feedback: false
